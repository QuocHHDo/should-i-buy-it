name: Tests
# Every push and pull request: the unit tests and the type check (fast), the jsdom click-through and accessibility
# check, and the real-browser tests (layout, camera scanning, the phone app, and the extension in Chromium).
on:
  push:
    branches-ignore: [eval-results, eval-results-branded]
  pull_request:
jobs:
  unit:
    name: Unit tests and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Type check (JSDoc + @ts-check; nothing is built)
        run: npm run typecheck
  llm-eval:
    name: LLM eval harness (unit tests and type check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llm-eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: llm-eval/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      # Grades the app's label parser (js/labelocr.js) on the 60 cases (free, no API key) and fails if overall
      # accuracy fell more than 3 points below the last parser run committed in llm-eval/results/.
      - name: Label parser accuracy gate
        run: npm run eval -- --extractor labelocr && npm run check
  ui:
    name: Click-through and accessibility (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Click-through UI test (both versions) and accessibility check
        run: npm run test:ui
  browser:
    name: Real-browser tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Layout, camera scanning, phone app, and the extension
        run: npm run test:layout
      - name: Screenshots, when something failed
        if: failure()
        run: mkdir -p shots && SHOTS_DIR=shots node tests/ui/app.js || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: shots/
